name: komovia_reversia
description: >
  Reversia rules, notation, and board representation for Komovia,
  implementing komovia_core's Game interface. Ported from zka32101/project-015
  (lib/engine/board.dart, move_generator.dart, game_state.dart).
publish_to: "none"

version: 0.1.0

environment:
  sdk: ^3.3.0

dependencies:
  komovia_core:
    git:
      url: https://github.com/zka32101/komovia_core
      ref: main

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
