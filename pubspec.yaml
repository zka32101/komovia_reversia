name: komovia_reversia
description: >
  Reversia rules, notation, AI, board rendering, and puzzles for Komovia,
  implementing komovia_core's Game/Engine/BoardRenderer/Puzzle interfaces.
  Ported from zka32101/project-015.
publish_to: "none"

version: 0.1.0

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  komovia_core:
    git:
      url: https://github.com/zka32101/komovia_core
      ref: main

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0
