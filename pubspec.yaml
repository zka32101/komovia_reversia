name: komovia_reversia
description: >
  Reversia rules, notation, AI, board rendering, and puzzles for Komovia,
  implementing komovia_core's Game/Engine/BoardRenderer/Puzzle interfaces.
  Ported from zka32101/project-015.
publish_to: "none"

version: 0.1.0

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  komovia_core:
    git:
      url: https://github.com/zka32101/komovia_core
      ref: main
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_crashlytics: ^3.4.0
  in_app_purchase: ^3.1.13
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  fake_cloud_firestore: ^2.5.2

flutter:
  uses-material-design: true
  generate: true
